# Reduced fixture modelled on the structure of Dify 1.17.1 docker/docker-compose.yaml.
x-shared-api-worker-config: &shared-api-worker-config
  env_file:
    - path: ./envs/optional.env
      required: false
    - ./.env
  networks:
    - ssrf_proxy_network
    - default

services:
  api:
    <<: *shared-api-worker-config
    image: langgenius/dify-api:1.17.1
    environment:
      MODE: api
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      AGENT_BACKEND_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}

  worker:
    <<: *shared-api-worker-config
    image: langgenius/dify-api:1.17.1
    environment:
      MODE: worker

  web:
    image: langgenius/dify-web:1.17.1
    environment:
      ALLOW_EMBED: ${ALLOW_EMBED:-false}

  db_postgres:
    image: postgres:15-alpine
    profiles:
      - postgresql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}

  redis:
    image: redis:6-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-http://ssrf_proxy:3128}
      HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-http://ssrf_proxy:3128}
    networks:
      - ssrf_proxy_network

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    environment:
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      PPROF_ENABLED: ${PLUGIN_PPROF_ENABLED:-false}
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
    ports:
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"

  agent_backend:
    image: langgenius/dify-agent-backend:1.17.1
    environment:
      DIFY_AGENT_SERVER_SECRET_KEY: ${DIFY_AGENT_SERVER_SECRET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY}
      DIFY_AGENT_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}

  ssrf_proxy:
    image: ubuntu/squid:latest
    environment:
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
    networks:
      - ssrf_proxy_network
      - default

  nginx:
    image: nginx:latest
    environment:
      NGINX_HTTPS_ENABLED: ${NGINX_HTTPS_ENABLED:-false}
    ports:
      - "127.0.0.1:${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    profiles:
      - weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED:-false}
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_AUTHENTICATION_APIKEY_ALLOWED_KEYS:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}

  opengauss:
    image: opengauss/opengauss:7.0.0-RC1
    profiles:
      - opengauss
    privileged: true
    environment:
      GS_PASSWORD: ${OPENGAUSS_PASSWORD:-Dify@123}
    ports:
      - ${OPENGAUSS_PORT:-6600}:${OPENGAUSS_PORT:-6600}

networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
